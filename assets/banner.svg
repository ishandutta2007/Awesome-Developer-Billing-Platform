<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0c10"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-glow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:20px;font-weight:400;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#38bdf8}.anim-pulse{animation:pulse-glow 6s infinite ease-in-out;transform-origin:center}.anim-float-1{animation:float-pill 4s infinite ease-in-out}.anim-float-2{animation:float-pill 5s infinite ease-in-out 1s}.flow-line{stroke-dasharray:8 6;animation:dash-flow 2s linear infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" rx="16"/><circle cx="150" cy="90" r="140" fill="#6366f1" class="anim-pulse" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="270" r="160" fill="#ec4899" class="anim-pulse" filter="url(#glow)" opacity=".12"/><