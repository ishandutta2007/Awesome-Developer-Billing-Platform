<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    
    /* Dynamic Animated Background Elements */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .anim-pulse {
      animation: pulse-glow 6s infinite ease-in-out;
      transform-origin: center;
    }
    .anim-float-1 {
      animation: float-pill 4s infinite ease-in-out;
    }
    .anim-float-2 {
      animation: float-pill 5s infinite ease-in-out 1s;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 2s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Animated Glowing Orbs (Background layer) -->
  <circle cx="150" cy="90" r="140" fill="#6366f1" opacity="0.15" class="anim-pulse" filter="url(#glow)" />
  <circle cx="1050" cy="270" r="160" fill="#ec4899" opacity="0.12" class="anim-pulse" filter="url(#glow)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Dynamic Graphic Accents (Bottom Right Side - background of text is clear) -->
  <g transform="translate(760, 60)">
    <!-- Main Decorative Card -->
    <rect x="0" y="0" width="380" height="240" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Mini Header Bar in Card -->
    <rect x="20" y="20" width="120" height="10" rx="5" fill="#475569" />
    <rect x="320" y="20" width="40" height="10" rx="5" fill="#6366f1" />

    <!-- Animated Data Chart Lines -->
    <path d="M 30 180 L 100 140 L 170 160 L 240 90 L 310 110 L 350 60" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 30 180 L 100 140 L 170 160 L 240 90 L 310 110 L 350 60 L 350 200 L 30 200 Z" fill="url(#primary-grad)" opacity="0.1" />

    <!-- Flow Connection Dots -->
    <circle cx="240" cy="90" r="5" fill="#ec4899" />
    <circle cx="350" cy="60" r="6" fill="#38bdf8" class="anim-pulse" />

    <!-- Floating Metric Pill 1 -->
    <g class="anim-float-1" transform="translate(-40, 40)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">💳 Stripe / Lago</text>
    </g>

    <!-- Floating Metric Pill 2 -->
    <g class="anim-float-2" transform="translate(240, 160)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">⚡ Real-time Usage</text>
    </g>

    <!-- Animated Flow Lines -->
    <path d="M -30 140 L 20 140" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
  </g>

  <!-- Foreground Text Content (Positioned cleanly on the left) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="15" y="20" class="badge-text">🚀 DEVELOPER BILLING 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" class="title">Awesome Developer</text>
    <text x="0" y="205" class="title" fill="url(#primary-grad)">Billing Platform ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="252" class="subtitle">Subscription Management, Usage Metering &amp; Payment Orchestration</text>

    <!-- Subtitle Bullet points -->
    <g transform="translate(0, 285)">
      <circle cx="6" cy="-5" r="3" fill="#10b981" />
      <text x="18" y="0" font-family="sans-serif" font-size="14" fill="#64748b">SaaS &amp; Merchant of Record</text>

      <circle cx="216" cy="-5" r="3" fill="#6366f1" />
      <text x="228" y="0" font-family="sans-serif" font-size="14" fill="#64748b">Open-Source Engines</text>

      <circle cx="406" cy="-5" r="3" fill="#ec4899" />
      <text x="418" y="0" font-family="sans-serif" font-size="14" fill="#64748b">Usage-Based Infrastructure</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primary-grad)" />
</svg>
